<h1>示例论文摘要：长程工具调用基准 LHB（虚构内容）</h1>
<p>本文为 InsightFlow 回放用的虚构示例，不对应真实论文。</p>
<p>我们提出长程工具调用基准 LHB，包含一百二十个需要十步以上工具交互的任务，覆盖文件操作、网页检索与结构化数据整理。</p>
<p>在 LHB 上，参数量相近的模型之间的差距，主要来自错误恢复策略而不是单步规划能力，能够在失败后主动重试并修正参数的模型平均完成率高出十一个百分点。</p>
<p>我们同时发现，提示中显式给出剩余步数预算会把平均完成率提高约四个百分点，但会降低开放探索类任务的多样性。</p>
